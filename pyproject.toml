[project]
name = "physics-ml"
version = "0.1.0"
description = "Research prototype: certified selective-write oscillator state-space models (H001)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy",
    "pyyaml",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
